<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Piano Mágico · Notas Mágicas</title>
<style>
:root{
  --bg1:#2e1a63; --bg2:#120a2b; --panel:#2a1b54; --panel2:#3b2680; --edge:#6a4fc4;
  --gold:#ffd166; --mag:#f72585; --cyan:#4cc9f0; --mint:#80ed99; --text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#2e1a63; --bg2:#120a2b; } }
:root[data-theme="dark"]{ --bg1:#2e1a63; --bg2:#120a2b; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--text);font-family:Calibri,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:clamp(6px,1.6vh,14px);padding:clamp(8px,2vw,18px)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:Cambria,Georgia,serif;font-size:clamp(18px,4.2vw,32px);color:var(--gold);flex:1;min-width:150px}
.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:700;font-size:clamp(13px,3vw,17px);color:#fff;background:var(--panel2);box-shadow:0 3px 8px #0006;cursor:pointer;touch-action:manipulation}
.btn.on{background:var(--mag)} .btn.cy{background:var(--cyan);color:#1b1035}
.btn:active{transform:translateY(1px) scale(.98)}
#info{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:8px 14px;min-height:64px}
#chordName{font-family:Cambria,Georgia,serif;font-weight:700;font-size:clamp(22px,5.5vw,40px);color:var(--gold);flex:1}
#chordNotes{font-size:clamp(13px,3vw,18px);color:#d9ccff}
#mascot{height:clamp(46px,9vh,80px);width:auto;transition:transform .2s}
#mascot.pop{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-6deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1)}}
#challenge{display:none;align-items:center;gap:10px;background:var(--panel2);border:2px dashed var(--gold);border-radius:14px;padding:8px 12px;flex-wrap:wrap}
#challenge.show{display:flex}
#target{font-family:Cambria,Georgia,serif;font-size:clamp(17px,4vw,26px);font-weight:700;color:var(--mint);flex:1}
#score{font-weight:700;color:var(--gold)}
#stage{position:relative;flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}

  seq.forEach(function(f,i){
    var o=ctx.createOscillator(), g=ctx.createGain(); o.type=kind==='ok'?'triangle':'sawtooth'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.11); g.gain.linearRampToValueAtTime(.22,t+i*.11+.02); g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.5);
    o.connect(g); g.connect(master); o.start(t+i*.11); o.stop(t+i*.11+.55);
  });
}

function build(){
  kb.innerHTML=''; keysEls={}; var nW=7*octaves+1, wW=100/nW, base=60, whites=[], blacks=[];
  for(var i=0;i<nW;i++){
    var oct=Math.floor(i/7), pc=WHITE_PC[i%7], midi=base+12*oct+pc;
    whites.push({i:i,midi:midi,pc:pc});
  }
  whites.forEach(function(w){
    var d=document.createElement('div'); d.className='wk'; d.dataset.midi=w.midi;
    d.style.left=(w.i*wW)+'%'; d.style.width=(wW-.35)+'%';
    var l=document.createElement('div'); l.className='lab'; l.textContent=NAMES[w.pc]; d.appendChild(l);
    kb.appendChild(d); keysEls[w.midi]=d;
    if(w.i<nW-1 && [0,1,3,4,5].indexOf(w.i%7)>=0){ blacks.push({x:(w.i+1)*wW, midi:w.midi+1}); }
  });
  blacks.forEach(function(b){
    var d=document.createElement('div'); d.className='bk'; d.dataset.midi=b.midi;
    var bw=wW*.62; d.style.width=bw+'%'; d.style.left=(b.x-bw/2)+'%';
    var l=document.createElement('div'); l.className='lab'; l.textContent=NAMES[b.midi%12]; d.appendChild(l);
    kb.appendChild(d); keysEls[b.midi]=d;
  });
  kb.classList.toggle('hide-lab',!showLab);
}
function keyAt(x,y){
  var el=document.elementFromPoint(x,y); if(!el) return null;
  if(el.classList.contains('lab')) el=el.parentNode;
  return (el&&el.dataset&&el.dataset.midi)?parseInt(el.dataset.midi,10):null;
}
function sparkAt(midi){
  var el=keysEls[midi]; if(!el) return; var r=el.getBoundingClientRect(), k=kb.getBoundingClientRect();
  var s=document.createElement('div'); s.className='spark'; s.style.left=(r.left-k.left+r.width/2)+'px'; s.style.top=(r.top-k.top+r.height*.25)+'px';
  kb.appendChild(s); setTimeout(function(){s.remove();},850);
}
function press(pid,midi){
  if(ptrKey[pid]===midi) return; release(pid);
  ptrKey[pid]=midi; active[midi]=(active[midi]||0)+1;
  keysEls[midi].classList.add('down'); noteOn(midi,midi); sparkAt(midi); update();
}
function release(pid){
  var m=ptrKey[pid]; if(m===undefined) return; delete ptrKey[pid];
  active[m]=(active[m]||1)-1;
  if(active[m]<=0){ delete active[m]; if(keysEls[m]) keysEls[m].classList.remove('down'); noteOff(m); }
  update();
}
kb.addEventListener('pointerdown',function(e){
  e.preventDefault(); try{kb.setPointerCapture(e.pointerId);}catch(_){}
  var m=keyAt(e.clientX,e.clientY); if(m!==null) press(e.pointerId,m);
},{passive:false});
kb.addEventListener('pointermove',function(e){
  if(ptrKey[e.pointerId]===undefined && e.buttons===0 && e.pointerType==='mouse') return;
  if(ptrKey[e.pointerId]===undefined && e.pointerType==='mouse' && e.buttons===0) return;
  var m=keyAt(e.clientX,e.clientY);
  if(m===null){ release(e.pointerId); return; }
  if(ptrKey[e.pointerId]!==undefined && m!==ptrKey[e.pointerId]) press(e.pointerId,m);
},{passive:false});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
  kb.addEventListener(ev,function(e){release(e.pointerId);});
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
/* teclado del computador */
var MAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74,p:75,';':76};
var down={};
window.addEventListener('keydown',function(e){ if(e.repeat||e.ctrlKey||e.metaKey) return; var m=MAP[e.key.toLowerCase()]; if(m!==undefined&&keysEls[m]){down[e.key]=1; press('k'+e.key,m);} });
window.addEventListener('keyup',function(e){ if(down[e.key]){delete down[e.key]; release('k'+e.key);} });

/* acordes */
var target=null, score=0, chMode=false, lockUntil=0;
var CH=[{n:'DO mayor',r:0,t:'M'},{n:'SOL mayor',r:7,t:'M'},{n:'FA mayor',r:5,t:'M'},{n:'LA menor',r:9,t:'m'},{n:'RE menor',r:2,t:'m'},{n:'MI menor',r:4,t:'m'},{n:'DO menor',r:0,t:'m'}];
function pcs(){ var s={}; Object.keys(active).forEach(function(m){s[m%12]=1;}); return Object.keys(s).map(Number).sort(function(a,b){return a-b;}); }
function detect(set){
  if(set.length!==3) return null;
  for(var i=0;i<3;i++){
    var r=set[i], has=function(x){return set.indexOf((r+x)%12)>=0;};
    if(has(4)&&has(7)) return {n:NAMES[r]+' mayor',r:r,t:'M'};
    if(has(3)&&has(7)) return {n:NAMES[r]+' menor',r:r,t:'m'};
  }
  return null;
}
function chordNotes(r,t){ return [NAMES[r],NAMES[(r+(t==='M'?4:3))%12],NAMES[(r+7)%12]].join(' – '); }
function update(){
  var set=pcs();
  var names=Object.keys(active).map(Number).sort(function(a,b){return a-b;}).map(function(m){return NAMES[m%12];});
  if(!names.length){ info.n.textContent=chMode&&target?'Forma el acorde…':'Toca una tecla…'; info.s.textContent='Prueba con 2 o 3 dedos a la vez'; return; }
  var c=detect(set);
  info.n.textContent = c?c.n:(names.length===1?names[0]:(names.length===2?'Dos notas: '+names.join(' + '):'Sonando…'));
  info.s.textContent = c?chordNotes(c.r,c.t):names.join(' – ');
  if(chMode&&target&&c&&c.r===target.r&&c.t===target.t&&Date.now()>lockUntil){ lockUntil=Date.now()+1500; win(); }
  else if(chMode&&target&&set.length===3&&!c&&Date.now()>lockUntil){ /* tres notas que no forman acorde: sin castigo */ }
}
function toast(ok,txt){
  var t=document.getElementById('toast'); document.getElementById('toastImg').src=ok?IMG_OK:IMG_BAD; document.getElementById('toastTxt').textContent=txt;
  t.classList.toggle('bad',!ok); t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1300);
}
function win(){
  score++; document.getElementById('score').textContent='Aciertos: '+score; sfx('ok'); toast(true,'¡Acorde correcto!');
  var m=document.getElementById('mascot'); m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
  setTimeout(nextTarget,1500);
}
function nextTarget(){
  var n; do{ n=CH[Math.floor(Math.random()*CH.length)]; }while(target&&n.n===target.n);
  target=n; document.getElementById('target').textContent='Forma: '+n.n+'  ('+chordNotes(n.r,n.t)+')';
}
document.getElementById('bCh').addEventListener('click',function(){
  chMode=!chMode; this.classList.toggle('on',chMode); this.textContent=chMode?'Salir del reto':'Reto de acordes';
  document.getElementById('challenge').classList.toggle('show',chMode); if(chMode){ensureAudio(); nextTarget();} update();
});
document.getElementById('bSkip').addEventListener('click',function(){ sfx('bad'); toast(false,'Otro intento'); nextTarget(); });
document.getElementById('bOct').addEventListener('click',function(){
  octaves=octaves===1?2:1; this.textContent=octaves===1?'2 octavas':'1 octava';
  Object.keys(voices).forEach(function(k){noteOff(k);}); active={}; ptrKey={}; build(); update();
});
document.getElementById('bLab').addEventListener('click',function(){
  showLab=!showLab; this.classList.toggle('on',showLab); kb.classList.toggle('hide-lab',!showLab);
});
build();
window.addEventListener('blur',function(){Object.keys(voices).forEach(function(k){noteOff(k);}); active={}; ptrKey={}; Object.keys(keysEls).forEach(function(k){keysEls[k].classList.remove('down');}); update();});
})();
</script>
